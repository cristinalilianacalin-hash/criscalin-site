name: Update videos from YouTube

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 07:17 Romania (winter time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh videos.json
        run: python scripts/update_videos.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- videos.json; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "criscalin-video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Daily video sync from YouTube"
          git push
